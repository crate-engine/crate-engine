# Orchestrator seat loadout (P2-10). Never edits code: write covers state files
# and boot briefs; bash covers agentctl + git-read. Largest binder of the
# five — watch prompt budget at boot (procedures stay lazy per INDEX doctrine).
seat: orchestrator
binder: config/orchestrator.md
append_system: []
skills:
  - config/skills/report.md
prompt_templates: []
extensions: []
cli_deps:
  - name: git
    check: command -v git
policy:
  tools: read,bash,write
  thinking: high
  default_model: openai-codex/gpt-5.5
  sandbox: standard
  permission_mode: bypassPermissions   # run #7: full-auto inside the wall (no per-command stalls)
  network: true
